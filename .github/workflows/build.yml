on:
  push:
    branches: [ master ]

jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Build APK
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}:/home/user/hostcwd"
          -v "${GITHUB_WORKSPACE}/.buildozer_global:/home/user/.buildozer"
          ghcr.io/kivy/buildozer:latest
          android debug

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk